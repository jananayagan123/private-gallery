<!DOCTYPE html>
<html>
<head>
  <title>Private Gallery</title>
</head>

<body>
  <h1>🔐 Private Gallery</h1>

  <div id="login">
    <p>Enter your key to continue</p>

    <input type="password" id="key" placeholder="Enter Key">
    <button onclick="checkKey()">Enter</button>

    <p id="message"></p>
  </div>

  <div id="gallery" style="display:none;">
    <h2>📸 Private Gallery</h2>

    <p>Upload Photos / Videos</p>

    <input
      type="file"
      id="fileInput"
      accept="image/*,video/*"
      multiple
    >

    <div id="galleryContent"></div>
  </div>

  <script>
    function checkKey() {
      const key = document.getElementById("key").value;

      if (key === "1234") {
        document.getElementById("message").innerText =
          "✅ Correct Key!";

        document.getElementById("gallery").style.display = "block";
      } else {
        document.getElementById("message").innerText =
          "❌ Wrong Key!";
      }
    }

    document.getElementById("fileInput").addEventListener("change", function() {
      const files = this.files;
      const gallery = document.getElementById("galleryContent");

      for (const file of files) {
        const url = URL.createObjectURL(file);

        if (file.type.startsWith("image/")) {
          const img = document.createElement("img");

          img.src = url;
          img.width = 250;
          img.style.margin = "10px";

          gallery.appendChild(img);
        }

        if (file.type.startsWith("video/")) {
          const video = document.createElement("video");

          video.src = url;
          video.width = 300;
          video.controls = true;
          video.style.margin = "10px";

          gallery.appendChild(video);
        }
      }
    });
  </script>
</body>
</html>
